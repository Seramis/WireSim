MEMORY {
    # Bank 0: 0x0000 - 0x3FFF (16kB)
    # Including ZP and Stack in the fill so the file is full size
    RAM_B0:   start = $0000, size = $4000, file = "%O.bank0.bin", define = yes;

    # Bank 1: 0x4000 - 0x7FFF (16kB)
    RAM_B1:   start = $4000, size = $4000, file = "%O.bank1.bin", define = yes;

    # Bank 2: 0x8000 - 0xBFFF (16kB)
    RAM_B2:   start = $8000, size = $4000, file = "%O.bank2.bin", define = yes;

    # Bank 3: 0xC000 - 0xFFFF (16kB)
    # We define one master memory block for the file to ensure perfect sizing
    ROM_B3:   start = $C000, size = $4000, file = "%O.bank3.bin", define = yes;
}

SEGMENTS {
    # Bank 0 Segments
    ZEROPAGE: load = RAM_B0, type = zp;
    STACK:    load = RAM_B0, type = bss, start = $0100, optional = yes;
    BSS:      load = RAM_B0, type = bss, start = $0200, define = yes;
    BANK0:    load = RAM_B0, type = rw,  start = $0200;

    # Bank 1 & 2 Segments
    BANK1:    load = RAM_B1, type = rw;
    BANK2:    load = RAM_B2, type = rw;
    DEBUGCFG: load = RAM_B2, type = rw, start = $BFFD;

    # Bank 3 Segments (Kernel)
    IO:       load = ROM_B3, type = rw,  start = $C000;
    CODE:     load = ROM_B3, type = rw,  start = $C100;
    KERNEL:   load = ROM_B3, type = rw,  start = $C100, define = yes;
    RODATA:   load = ROM_B3, type = rw,  optional = yes;

    # Vectors: $FFFA-$FFFF
    VECTORS:  load = ROM_B3, type = rw,  start = $FFFA;
}